name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "plugin"

  check-card:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: node --check dist/energie-dashboard-card.js
      - name: Version in card and CHANGELOG match
        run: |
          V=$(grep -oP "^const VERSION = '\K[^']+" dist/energie-dashboard-card.js)
          echo "Card version: $V"
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $V"; exit 1; }
