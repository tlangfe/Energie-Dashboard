name: Release

# Neue Version: VERSION in dist/energie-dashboard-card.js und CHANGELOG.md anpassen, dann auf GitHub ein Release mit Tag "v<Version>" anlegen
# (oder den Tag pushen). Die Kartendatei wird automatisch angehaengt.
# Tags mit Bindestrich (z. B. v1.0.0-beta.1) werden als Vorab-Version veroeffentlicht.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          V=$(grep -oP "^const VERSION = '\K[^']+" dist/energie-dashboard-card.js)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match card version $V"; exit 1; }
          node --check dist/energie-dashboard-card.js
          awk "/^## \[$V\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease";; esac
          # Release schon auf der GitHub-Webseite angelegt? Dann nur die Kartendatei anhaengen.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/energie-dashboard-card.js --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/energie-dashboard-card.js --title "${GITHUB_REF_NAME}" --notes-file notes.md $PRE
          fi
